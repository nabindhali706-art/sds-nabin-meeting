
name: Extract SDS Nabin Meeting Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/sds-project
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP" -d /tmp/sds-project
          cp -a /tmp/sds-project/sds-nabin-meeting/. .
          rm "$ZIP"

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract SDS Nabin Meeting project" || echo "No changes"
          git push
